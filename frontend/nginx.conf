# frontend/nginx.conf
# ==============================
# Nginx configuration for the Vigil frontend
# - Serves the React SPA static build
# - Proxies /api/* requests to the backend container
# - Handles SPA routing (all non-file, non-api requests -> index.html)
# ==============================

server {
    listen 80;
    server_name _;

    # Root directory for static files (the React build output)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster load times
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # ---------------------------------------------------------------
    # API Proxy: forward /api/* requests to the backend container
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Increase timeout for long-running price checks
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ---------------------------------------------------------------
    # Static files: serve with long cache headers
    # ---------------------------------------------------------------
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------
    # SPA routing: for any non-file request, serve index.html
    # This allows React Router to handle the route
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Do not cache index.html so the app always fetches fresh JS bundles
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }
}